name = "mamba-website"
compatibility_date = "2025-05-20"
compatibility_flags = ["nodejs_compat"]
# Only dist/ is published. scripts/build-public.mjs fills it on every deploy;
# the repository root holds tests, migrations and tools that must stay private.
pages_build_output_dir = "dist"

[vars]
BACKEND_MANAGER_URL = "https://manager.mambaapp.online"

[[d1_databases]]
binding = "DB"
database_name = "mamba-db"
database_id = "67eba1af-8b20-426a-a530-bbef233309b6"
